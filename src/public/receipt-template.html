<!DOCTYPE html>
<html>
  <head>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap");
      html,
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        background: #5046e5;
        background-color: #5046e5;
      }

      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        background: #5046e5;
        background-color: #5046e5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .ticket-container {
        background: white;
        width: 90%;
        max-width: 600px;
        border-radius: 20px;
        padding: 30px;
        margin: 20px;
        position: relative;
      }

      .ticket-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .logo {
        color: #5046e5;
        font-size: 32px;
        font-weight: 600;
      }

      .date {
        text-align: right;
        font-size: 14px;
      }

      .event-title {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 30px;
      }

      .section {
        margin-bottom: 20px;
      }

      .label {
        color: #666;
        font-size: 14px;
        margin-bottom: 5px;
      }

      .value {
        font-size: 16px;
        font-weight: 500;
      }

      .qr-code {
        text-align: right;
        margin-top: 30px;
      }

      .qr-code img {
        width: 150px;
        height: 150px;
      }

      .qr-id {
        text-align: right;
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }

      .powered-by {
        text-align: center;
        color: white;
        font-size: 14px;
        margin-top: 20px;
      }

      .ticket-edge {
        position: absolute;
        top: -1px;
        left: 0;
        right: 0;
        height: 20px;
        background-image: radial-gradient(
            circle at 30px -10px,
            transparent 20px,
            white 21px
          ),
          radial-gradient(circle at 90px -10px, transparent 20px, white 21px),
          radial-gradient(circle at 150px -10px, transparent 20px, white 21px),
          radial-gradient(circle at 270px -10px, transparent 20px, white 21px),
          radial-gradient(circle at 330px -10px, transparent 20px, white 21px),
          radial-gradient(circle at 390px -10px, transparent 20px, white 21px);
      }
    </style>
  </head>
  <body>
    <div class="ticket-container">
      <div class="ticket-edge"></div>
      <div class="ticket-header">
        <div class="logo">Hilaq</div>
        <div class="date">
          {{time}}<br />
          {{date}}
        </div>
      </div>

      <div class="event-title">{{eventName}}</div>

      <div class="section">
        <div class="label">Ticket</div>
        <div class="value">{{ticketName}}</div>
      </div>

      <div class="section">
        <div class="label">Address</div>
        <div class="value">{{address}}</div>
      </div>

      <div class="section">
        <div class="label">Event Date</div>
        <div class="value">{{eventDate}}</div>
      </div>

      <div class="section">
        <div class="label">Ticket Id</div>
        <div class="value">{{ticketEntryCode}}</div>
      </div>

      <div class="section">
        <div class="label">Order Information</div>
        <div class="value">By {{customerName}} on {{orderDate}}</div>
      </div>

      <div class="qr-code">
        <img src="{{qrCode}}" alt="QR Code" />
        <div class="qr-id">{{ticketEntryCode}}</div>
      </div>
    </div>

    <div class="powered-by">Powered by Hilaq</div>
  </body>
</html>
