# OpenAPI Specification - Business Module

paths:
  /api/businesses:
    get:
      tags: [Business]
      summary: List user's businesses
      description: Get all businesses the authenticated user owns or is a member of
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of businesses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/Business'
        401:
          description: Not authenticated

    post:
      tags: [Business]
      summary: Create a new business
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "My Islamic Learning Center"
      responses:
        201:
          description: Business created
        400:
          description: Validation error

  /api/businesses/has:
    get:
      tags: [Business]
      summary: Check if user has businesses
      security:
        - bearerAuth: []
      responses:
        200:
          description: Boolean result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          has_businesses:
                            type: boolean

  /api/businesses/slug/{slug}:
    get:
      tags: [Business]
      summary: Get business by slug (Public)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: "islamic-learning-center"
      responses:
        200:
          description: Business details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: './components.yaml#/components/schemas/Business'
        404:
          description: Business not found

  /api/businesses/categories:
    get:
      tags: [Business]
      summary: List business categories (Public)
      responses:
        200:
          description: List of categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            slug:
                              type: string

  /api/businesses/{businessId}:
    get:
      tags: [Business]
      summary: Get business by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: businessId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Business details
        404:
          description: Business not found

    patch:
      tags: [Business]
      summary: Update business
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: businessId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                logo_url:
                  type: string
                  format: uri
      responses:
        200:
          description: Business updated
        403:
          description: Not authorized

    delete:
      tags: [Business]
      summary: Delete business (soft)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: businessId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Business deleted
        403:
          description: Not authorized
