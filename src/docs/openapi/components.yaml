# OpenAPI Components - Shared Schemas
# This file contains reusable schemas referenced across all API modules

components:
  schemas:
    # ==========================================================================
    # Common Response Schemas
    # ==========================================================================
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "An error occurred"
        error:
          type: string
        statusCode:
          type: integer
          example: 400
      required:
        - success
        - message

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    # ==========================================================================
    # Business Schemas
    # ==========================================================================
    
    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Islamic Learning Center"
        slug:
          type: string
          example: "islamic-learning-center"
        status:
          type: string
          enum: [active, inactive, deleted]
        owner_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==========================================================================
    # User Schemas
    # ==========================================================================
    
    UserPreferences:
      type: object
      properties:
        last_active_store_id:
          type: string
          format: uuid
          nullable: true
        last_active_publication_id:
          type: string
          format: uuid
          nullable: true
        timezone:
          type: string
          example: "Africa/Lagos"
        currency:
          type: string
          example: "NGN"
        locale:
          type: string
          example: "en"
        theme:
          type: string
          enum: [light, dark, system]
          example: "light"

    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        label:
          type: string
          example: "Home"
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postal_code:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ==========================================================================
    # Session Schemas
    # ==========================================================================
    
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "Tafsir Class - Surah Baqarah"
        description:
          type: string
        cover_image_url:
          type: string
          format: uri
          nullable: true
        visibility:
          type: string
          enum: [public, private, members_only]
        pricing_type:
          type: string
          enum: [free, paid, donation]
        price:
          type: number
          format: float
          nullable: true
        status:
          type: string
          enum: [active, paused, completed, cancelled]
        business_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        member_count:
          type: integer

    SessionDetailed:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            business:
              $ref: '#/components/schemas/Business'
            facilitators:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
            next_occurrence:
              $ref: '#/components/schemas/SessionOccurrence'

    SessionOccurrence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        location_type:
          type: string
          enum: [online, physical]
        location_value:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]

    SessionMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [audience, facilitator]
        payment_status:
          type: string
          enum: [pending, paid, free]
        joined_at:
          type: string
          format: date-time

    # ==========================================================================
    # Event Schemas
    # ==========================================================================
    
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "Annual Islamic Conference"
        description:
          type: string
        cover_image_url:
          type: string
          format: uri
          nullable: true
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        location:
          type: string
        venue:
          type: string
        status:
          type: string
          enum: [draft, published, cancelled, completed]
        business_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    EventQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        question:
          type: string
        user_id:
          type: string
          format: uuid
        is_answered:
          type: boolean
        is_visible:
          type: boolean
        answer:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ==========================================================================
    # Webhook Schemas
    # ==========================================================================
    
    PaystackWebhookPayload:
      type: object
      properties:
        event:
          type: string
          example: "charge.success"
        data:
          type: object
          properties:
            reference:
              type: string
            amount:
              type: integer
            currency:
              type: string
            customer:
              type: object
              properties:
                email:
                  type: string
                  format: email
            metadata:
              type: object

  # ============================================================================
  # Security Schemes
  # ============================================================================
  
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Supabase authentication
