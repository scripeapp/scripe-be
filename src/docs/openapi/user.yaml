# OpenAPI Specification - User Module

paths:
  /api/user/preferences:
    get:
      tags: [User]
      summary: Get user preferences
      security:
        - bearerAuth: []
      responses:
        200:
          description: User preferences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: './components.yaml#/components/schemas/UserPreferences'
        401:
          description: Not authenticated

    patch:
      tags: [User]
      summary: Update user preferences
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                last_active_store_id:
                  type: string
                  format: uuid
                last_active_publication_id:
                  type: string
                  format: uuid
                timezone:
                  type: string
                  example: "Africa/Lagos"
                currency:
                  type: string
                  example: "NGN"
                locale:
                  type: string
                  example: "en"
                theme:
                  type: string
                  enum: [light, dark, system]
      responses:
        200:
          description: Preferences updated
        401:
          description: Not authenticated

  /api/user/addresses:
    get:
      tags: [User]
      summary: List user addresses
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of addresses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './components.yaml#/components/schemas/Address'

    post:
      tags: [User]
      summary: Add new address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, street, city, state, country]
              properties:
                label:
                  type: string
                  example: "Home"
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                postal_code:
                  type: string
                is_default:
                  type: boolean
                  default: false
      responses:
        201:
          description: Address created
        400:
          description: Validation error

  /api/user/addresses/{id}:
    patch:
      tags: [User]
      summary: Update address
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                postal_code:
                  type: string
      responses:
        200:
          description: Address updated
        404:
          description: Address not found

    delete:
      tags: [User]
      summary: Delete address
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Address deleted
        404:
          description: Address not found

  /api/user/addresses/{id}/default:
    post:
      tags: [User]
      summary: Set default address
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Default address set
        404:
          description: Address not found
