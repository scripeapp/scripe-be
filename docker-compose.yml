services:
  postgres:
    image: postgres:16
    container_name: scripe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scripe_dev
    ports:
      - "5432:5432"
    volumes:
      - scripe-postgres-data:/var/lib/postgresql/data
      - ./src/db/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scripe_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scripe-postgres-data: