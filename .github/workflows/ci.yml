name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BETTER_AUTH_SECRET: better-auth-ci-secret-32-chars-minimum!!xyz
  BETTER_AUTH_URL: http://localhost:4000

jobs:
  guardrails:
    name: Boundary guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static removal gate (no Supabase artifacts in next/)
        run: |
          if rg -n --hidden --no-ignore \
            "@supabase|SupabaseClient|req\.supabase|supabase\.auth|supabase\.storage|supabase\.co|SUPABASE_|NEXT_PUBLIC_SUPABASE_|auth\.uid\(\)|auth\.jwt\(\)|service_role|anon key" \
            next/src next/package.json next/.env.example next/docker-compose.yml \
            --glob '!bun.lock' --glob '!*.codegen.ts' --glob '!node_modules/**'; then
            echo "::error::Supabase artifacts found in next/. Migration is incomplete."
            exit 1
          fi
          echo "No Supabase artifacts in next/."

      - name: Legacy-import gate (next/ must not import legacy source)
        run: |
          cd next
          if rg -n \
            "surge-be/src|surge-be/supabase|../../../../supabase|@/supabase" \
            src --glob '*.{ts,mts,cts}'; then
            echo "::error::next/ imports legacy surge-be source. Reuse legacy code only by reviewed copy + new tests."
            exit 1
          fi
          echo "No legacy imports from next/."

      - name: "Secret scan (tracked files: no Supabase keys/URLs)"
        run: |
          if rg -n --hidden --no-ignore \
            "SUPABASE_KEY|SUPABASE_URL|sbp_|eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9" \
            next/src next/package.json next/.env.example next/docker-compose.yml \
            --glob '!bun.lock' --glob '!node_modules/**'; then
            echo "::error::Possible Supabase secret or key material committed."
            exit 1
          fi
          echo "No Supabase secrets found."

  backend:
    name: Backend (typecheck · lint · migrations · tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surge_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d surge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://surge_app@localhost:5432/surge_ci
      DATABASE_MIGRATE_URL: postgres://surge_migrator@localhost:5432/surge_ci
      ALLOW_DATABASE_RESET: "true"
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Bootstrap roles (superuser, before migrations)
        run: |
          psql -v ON_ERROR_STOP=1 -U postgres -h localhost -d surge_ci -f src/db/bootstrap.sql

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Production build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Migrate from empty DB (up)
        run: bun run db:migrate

      - name: Verify migration state
        run: bun run db:migrate:status

      - name: Full down to zero + re-up (reversibility)
        run: |
          bun run db:migrate:down:all
          if bun run db:migrate:status 2>&1 | grep -q "Applied:"; then
            echo "::error::Down migrations did not fully revert to zero."
            bun run db:migrate:status
            exit 1
          fi
          echo "Reverted to zero. Re-applying."
          bun run db:migrate

      - name: Reset recreates everything from empty DB
        run: bun run db:reset

      - name: DB safety check (roles/RLS)
        run: bun run db:check

      - name: Seed
        run: bun run db:seed

      - name: Generate types from schema
        run: bun run db:types

      - name: Generated types are committed and in sync
        run: |
          if ! git diff --exit-code -- src/db/database.types.codegen.ts; then
            echo "::error::database.types.codegen.ts is out of sync. Run 'bun run db:types' and commit the result."
            exit 1
          fi

      - name: Test
        run: bun run test
